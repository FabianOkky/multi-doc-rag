; PHP settings for the built-in server started by `php artisan serve`.
;
; `artisan serve` spawns `php -S` as a child process, so `-d` flags passed to the
; parent command never reach the process that actually handles requests. Pointing
; PHPRC at this file is the supported way to configure that child (PHPRC is
; allowed through to it by AppServiceProvider).
;
;   PHPRC=/app/deploy/php.ini php artisan serve
;
; The app accepts uploads of up to 20 MB per file, and PHP's own defaults (2 MB)
; would reject them before Laravel ever sees the request. post_max_size allows for
; several files in one request.
;
; This file lives outside the web root on purpose, so it is never served.

upload_max_filesize = 21M
post_max_size = 210M
memory_limit = 512M
max_execution_time = 120
